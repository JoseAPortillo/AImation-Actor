[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aimation-actor-core"
version = "0.1.0"
description = "AImation Actor AI Core — local modular monolith for AI-assisted animation"
readme = "docs/SDD.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "AImation Actor Team" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "mypy>=1.10",
    "hypothesis>=6.100",
    "import-linter>=2.0",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["aimation_actor_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
strict = true
python_version = "3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
