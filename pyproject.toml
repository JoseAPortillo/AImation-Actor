[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aimation-actor-core"
version = "0.1.0"
description = "AImation Actor AI Core — local modular monolith for AI-assisted animation"
readme = "docs/SDD.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "AImation Actor Team" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
ai = [
    "opencv-python-headless>=5.0",
    "numpy>=2.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "mypy>=1.10",
    "hypothesis>=6.100",
    "import-linter>=2.0",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["aimation_actor_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
strict = true
python_version = "3.14"

[tool.ruff]
line-length = 100
target-version = "py314"

# B008: FastAPI dependency injection uses Depends(...) in argument defaults —
# the idiomatic pattern is a deliberate false-positive for bugbear.
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]
ignore = ["B008"]

# Enforce the modular-monolith layer rules from SDD §2.3.
# main.py lives at the package root (not inside api/), so the composition root
# may import infrastructure directly without violating these contracts.
[tool.importlinter]
root_package = "aimation_actor_core"
include_external_packages = false

[[tool.importlinter.contracts]]
name = "SDD §2.3 — api must not import infrastructure directly"
type = "forbidden"
source_modules = ["aimation_actor_core.api"]
forbidden_modules = ["aimation_actor_core.infrastructure"]

[[tool.importlinter.contracts]]
name = "SDD §2.3 — domain is pure, may not import api or infrastructure"
type = "forbidden"
source_modules = ["aimation_actor_core.domain"]
forbidden_modules = ["aimation_actor_core.api", "aimation_actor_core.infrastructure"]

[[tool.importlinter.contracts]]
name = "SDD §2.3 — infrastructure must not import api"
type = "forbidden"
source_modules = ["aimation_actor_core.infrastructure"]
forbidden_modules = ["aimation_actor_core.api"]

[[tool.importlinter.contracts]]
name = "SDD §2.3 — shared imports nothing internal"
type = "forbidden"
source_modules = ["aimation_actor_core.shared"]
forbidden_modules = ["aimation_actor_core.api", "aimation_actor_core.domain", "aimation_actor_core.infrastructure"]
